name: Build
description: Build and check the package into dist/. Shared by CI and Canary CI; expects the repository to be checked out.

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - name: Set up Python 3
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"
    - name: Build and check package
      shell: bash
      run: |
        just build
